worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_origin $cors_origin {
        default "";
        "http://localhost:8080" $http_origin;
        "http://localhost:5173" $http_origin;
        "http://127.0.0.1:8080" $http_origin;
    }
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    log_format request_json escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","uri":"$request_uri","status":$status,"duration":$request_time,"upstream":"$upstream_addr","upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout request_json;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        client_max_body_size 1m;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "X-Request-ID, Location" always;
        add_header Vary Origin always;
        add_header X-Request-ID $request_id always;
        limit_req_status 429;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            return 429 '{"error":"Demasiadas solicitudes. Espere y vuelva a intentar."}';
        }
        location / {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_limit burst=30 nodelay;
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Request-ID;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
