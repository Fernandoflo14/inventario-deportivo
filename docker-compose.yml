name: inventario-deportivo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecute scripts/iniciar.ps1 para crear .env}
    volumes:
      - inventory_data:/var/lib/postgresql/data
    networks:
      - inventory_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Inventory: Host=db;Port=5432;Database=inventory;Username=inventory;Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventory_net
    restart: unless-stopped
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - inventory_net
    restart: unless-stopped
networks:
  inventory_net:
    driver: bridge
volumes:
  inventory_data:
